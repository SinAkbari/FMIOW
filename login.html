<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به پورتال — فریال</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: "Kalameh";
      src: url("https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/fonts/kalameh/KalamehWeb(FaNum)-Light.woff2") format("woff2");
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/fonts/kalameh/KalamehWeb(FaNum)-Regular.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/fonts/kalameh/KalamehWeb(FaNum)-Medium.woff2") format("woff2");
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/fonts/kalameh/KalamehWeb(FaNum)-SemiBold.woff2") format("woff2");
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Kalameh";
      src: url("https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/fonts/kalameh/KalamehWeb(FaNum)-Bold.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --elevated: #1c1917;
      --accent: #c5a572;
      --cta: #ca8a04;
      --ivory: #f5f0e8;
      --muted: #a8a29e;
      --hairline: rgba(197, 165, 114, 0.22);
      --ease-cine: cubic-bezier(0.22, 1, 0.36, 1);
      --radius-sm: 10px;
      --font-fa: "Kalameh", Tahoma, sans-serif;
      --font-en-display: "Cormorant", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--font-fa);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    button { font-family: inherit; cursor: pointer; }

    .auth {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
    }
    @media (min-width: 900px) {
      .auth {
        direction: ltr;
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .auth-visual {
      position: relative;
      height: 22vh;
      max-height: 168px;
      min-height: 120px;
      overflow: hidden;
      isolation: isolate;
    }
    @media (min-width: 900px) {
      .auth-visual {
        height: auto;
        max-height: none;
        min-height: 100vh;
      }
    }

    .auth-visual-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 48% 40%, rgba(197, 165, 114, 0.18), transparent 65%),
        url("assets/piano-login.jpg") center 45% / cover no-repeat;
      transform: scale(1.05);
    }
    @media (min-width: 900px) {
      .auth-visual-bg {
        animation: slowPan 18s ease-in-out infinite alternate;
      }
    }
    @keyframes slowPan {
      from { transform: scale(1.05) translate(0, 0); }
      to { transform: scale(1.09) translate(-1.5%, 1%); }
    }

    /* Mobile: fade BOTTOM of image into form */
    .auth-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 25%, rgba(10, 10, 10, 0.55) 70%, var(--bg) 100%);
    }
    /* Desktop: fade RIGHT of image into form panel */
    @media (min-width: 900px) {
      .auth-visual::after {
        background:
          linear-gradient(90deg, transparent 45%, rgba(10, 10, 10, 0.55) 78%, var(--bg) 100%),
          linear-gradient(0deg, rgba(10, 10, 10, 0.25) 0%, transparent 40%);
      }
    }

    .auth-panel {
      position: relative;
      z-index: 3;
      direction: rtl;
      text-align: right;
      padding: 1.15rem 1.25rem 1.5rem;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      opacity: 0;
      animation: panelIn 700ms var(--ease-cine) 80ms forwards;
    }
    @media (min-width: 900px) {
      .auth-panel {
        padding: 3.5rem;
        justify-content: center;
      }
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 1rem;
      transition: color 200ms ease;
    }
    @media (min-width: 900px) { .back { margin-bottom: 2rem; } }
    .back:hover { color: var(--accent); }

    .brand {
      font-size: 0.9rem;
      margin-bottom: 0.85rem;
      color: var(--ivory);
    }
    .brand span {
      font-family: var(--font-en-display);
      font-style: italic;
      color: var(--accent);
      margin-left: 0.35rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.45rem, 3vw, 2.35rem);
      font-weight: 700;
      line-height: 1.3;
    }
    .hint {
      color: var(--muted);
      font-weight: 300;
      margin: 0 0 1rem;
      font-size: 0.9rem;
    }
    @media (min-width: 900px) {
      .hint { margin-bottom: 1.75rem; }
    }

    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .segment button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 0.7rem;
      font-size: 0.88rem;
      transition: background 220ms ease, color 220ms ease;
    }
    .segment button.is-active {
      background: var(--elevated);
      color: var(--accent);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.85rem;
    }
    .field label {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .field input {
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--ivory);
      padding: 0.78rem 0.95rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }
    @media (min-width: 900px) {
      .field { margin-bottom: 1.1rem; }
      .field input { padding: 0.9rem 1.05rem; }
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(197, 165, 114, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.85rem 1.3rem;
      border-radius: var(--radius-sm);
      border: 0;
      background: var(--cta);
      color: #0a0a0a;
      font-size: 0.92rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(202, 138, 4, 0.2);
      transition: background 200ms ease, transform 200ms ease;
    }
    .btn:hover {
      background: #d4a017;
      transform: translateY(-1px);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .auth-links {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.85rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .auth-links a:hover { color: var(--accent); }

    .status {
      min-height: 1.1rem;
      margin-top: 0.55rem;
      font-size: 0.82rem;
      color: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-visual-bg, .auth-panel {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="auth">
    <div class="auth-visual" id="authVisual">
      <div class="auth-visual-bg"></div>
    </div>

    <div class="auth-panel">
      <a class="back" href="index.html">→ بازگشت به خانه</a>
      <div class="brand"><span>Feryal</span> فریال</div>
      <h1>ورود به پورتال</h1>
      <p class="hint">هنرجو یا استاد — یک ورود، دو مسیر.</p>

      <div class="segment" role="tablist" aria-label="نوع کاربر">
        <button type="button" class="is-active" data-role="student">هنرجو</button>
        <button type="button" data-role="teacher">استاد</button>
      </div>

      <form id="loginForm" action="#" method="post">
        <div class="field">
          <label for="email">ایمیل یا شماره موبایل</label>
          <input id="email" name="email" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">ورود</button>
        <div class="auth-links">
          <a href="#">فراموشی رمز عبور</a>
          <a href="#">ساخت حساب هنرجو</a>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script>
    document.querySelectorAll(".segment button").forEach((btn) => {
      btn.addEventListener("click", () => {
        btn.parentElement.querySelectorAll("button").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
      });
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const role = document.querySelector(".segment .is-active")?.dataset.role;
      document.getElementById("status").textContent =
        role === "teacher" ? "آماده ورود به پورتال استاد…" : "آماده ورود به پورتال هنرجو…";
    });
  </script>
</body>
</html>
